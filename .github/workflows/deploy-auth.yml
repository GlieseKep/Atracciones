# Publica el mismo out/backend.zip en la App Service de dev-auth (comando de inicio: node apps/auth/dist/main.js).
name: Deploy dev-auth (App Service)

on:
  push:
    branches: [main]
    paths:
      - "apps/auth/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.base.json"
      - "tools/package-backend.ps1"
      - ".github/workflows/deploy-auth.yml"
  workflow_dispatch:

concurrency:
  group: deploy-auth
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Empaquetar backend
        shell: pwsh
        run: ./tools/package-backend.ps1
      - name: Publicar en Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: tourgirls-auth-mms
          publish-profile: ${{ secrets.AZURE_AUTH_PUBLISH_PROFILE }}
          package: out/backend.zip
