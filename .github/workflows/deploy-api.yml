# Compila y prueba el backend, arma out/backend (código empaquetado + node_modules de producción para Linux)
# y lo publica en la App Service del API. Azure no compila nada: solo ejecuta node apps/api/dist/main.js.
name: Deploy API (App Service)

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.base.json"
      - "tools/package-backend.mjs"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:unit
      - name: Empaquetar backend
        run: node tools/package-backend.mjs
      - name: Publicar en Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: tourgirls-api-mms
          publish-profile: ${{ secrets.AZURE_API_PUBLISH_PROFILE }}
          package: out/backend
