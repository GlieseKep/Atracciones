# Compila y prueba el backend, empaqueta out/backend.zip y lo publica en la App Service del API.
# App Service vuelve a instalar dependencias y compilar (SCM_DO_BUILD_DURING_DEPLOYMENT=true).
name: Deploy API (App Service)

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.base.json"
      - "tools/package-backend.ps1"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:unit
      - name: Empaquetar backend
        shell: pwsh
        run: ./tools/package-backend.ps1
      - name: Publicar en Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: tourgirls-api-mms
          publish-profile: ${{ secrets.AZURE_API_PUBLISH_PROFILE }}
          package: out/backend.zip
