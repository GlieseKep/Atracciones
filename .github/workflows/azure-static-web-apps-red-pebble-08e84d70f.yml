name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "AtraccionesService-web/**"
      - ".github/workflows/azure-static-web-apps-red-pebble-08e84d70f.yml"
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_deploy_job:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        env:
          # Se fijan al compilar (Vite). Origen del API sin /api/v1: el cliente agrega el prefijo.
          VITE_API_URL: https://tourgirls-api-mms-hagtfccfdddceheu.westus2-01.azurewebsites.net
          VITE_AUTH_URL: https://tourgirls-auth-mms-akcxfugse5c6g6bd.westus2-01.azurewebsites.net
          VITE_CATALOG_SOURCE: auto
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_RED_PEBBLE_08E84D70F }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          app_location: "AtraccionesService-web"
          api_location: ""
          output_location: "dist"

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_RED_PEBBLE_08E84D70F }}
          action: "close"
